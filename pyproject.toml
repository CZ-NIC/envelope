[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "envelope"
version = "2.4.2"
description = "Insert a message and attachments and send e-mail / sign / encrypt contents by a single line."
authors = ["Edvard Rejthar <edvard.rejthar@nic.cz>"]
license = "LGPL-3.0-or-later"
homepage = "https://github.com/CZ-NIC/envelope"
readme = "README.md"
classifiers = ["Programming Language :: Python :: 3"]

[tool.poetry.dependencies]
python = ">=3.10"
python-magic = "*"
python-gnupg = ">=0.5"
py3-validate-email = "*"
cryptography = { version = ">=43", optional = true }

[tool.poetry.extras]
smime = ["cryptography"]

[tool.poetry.scripts]
envelope = "envelope.__main__:main"

[dependency-groups]
test = [
    "pytest>=8",
    "pytest-xdist",
    "pytest-cov",
    "syrupy",
    "aiosmtpd",
    "cryptography>=43",
    "M2Crypto",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
markers = [
    "gpg: needs the gpg binary",
    "smime: needs the S/MIME extras (cryptography, M2Crypto)",
    "cli: exercises the command line interface",
]
addopts = ["-ra", "--strict-markers"]
filterwarnings = [
    "error",
    "ignore:distutils Version classes are deprecated:DeprecationWarning:M2Crypto",
]

# Releasing: see Makefile. The topmost "## Unreleased" CHANGELOG.md heading is required, a bump dates it.
[tool.bumpversion]
current_version = "2.4.2"
commit = true
tag = true
tag_name = "{new_version}"
tag_message = "{new_version}"
message = "chore(release): {new_version}"

# CHANGELOG first, so that a missing heading fails before anything is written.
[[tool.bumpversion.files]]
filename = "CHANGELOG.md"
search = "## Unreleased"
replace = "## {new_version} ({now:%Y-%m-%d})"

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = '^version = "{current_version}"'
replace = 'version = "{new_version}"'
regex = true
