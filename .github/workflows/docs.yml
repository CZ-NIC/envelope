# Builds and deploys the mkdocs documentation to GitHub Pages.
#
# INACTIVE until you switch the repo's Pages source to "GitHub Actions"
# (Settings → Pages → Build and deployment → Source: GitHub Actions).
# While Pages is still "Deploy from a branch", this workflow builds but does not publish.
name: docs

on:
  push:
    branches: [main]
    paths:
      - "CHANGELOG.md"
      - "mkdocs.yml"
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install -r docs/requirements.txt
      - run: mkdocs build -d _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
